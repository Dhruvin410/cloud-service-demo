apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-service-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-service-demo
  template:
    metadata:
      labels:
        app: cloud-service-demo
    spec:
      containers:
        - name: web
          image: cloud-service-demo:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80